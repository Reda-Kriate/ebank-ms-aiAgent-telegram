server:
  port: 9999
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path= /customers/**

            - id: ebank-service
              uri: http://localhost:8082
              predicates:
                - Path=/orders/**

